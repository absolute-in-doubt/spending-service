spring:
  application:
    name: spending.service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://postgres:5432/spending_service_db}
    username: ${POSTGRES_USER:myuser}
    password: ${POSTGRES_PASSWORD:secret}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true

logging:
  level:
    org.jooq.tools.LoggerListener: DEBUG

app:
  currency:
    twelvedata:
      base-url: ${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
      api-key: ${TWELVE_DATA_API_KEY:demo}
      connect-timeout: 1s
      read-timeout: 2s
    sync:
      enabled: ${CURRENCY_SYNC_ENABLED:true}
      fixed-delay: 1h
      run-on-startup: true
      default-pairs:
        - "KZT/USD"
        - "RUB/USD"
  dlq:
    worker:
      enabled: ${DLQ_WORKER_ENABLED:true}
      fixed-delay: 10s
      batch-size: 10
      lease-duration: 30s
      retries-per-attempt: 3
      retry-backoff: 500ms
      retries-total: 5
      thread-pool-size: 2

resilience4j:
  circuitbreaker:
    instances:
      twelveData:
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  ratelimiter:
    instances:
      twelveData:
        limit-for-period: 8
        limit-refresh-period: 1m
        timeout-duration: 500ms

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always