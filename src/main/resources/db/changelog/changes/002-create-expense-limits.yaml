databaseChangeLog:
  - changeSet:
      id: 002-create-expense-limits
      author: spending-service
      changes:
        - createSequence:
            sequenceName: expense_limit_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: expense_limits
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: nextval('expense_limit_seq')
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_expense_limits
                    nullable: false
              - column:
                  name: account_from
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: expense_category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: limit_sum
                  type: NUMERIC(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: limit_currency_shortname
                  type: VARCHAR(3)
                  defaultValue: USD
                  constraints:
                    nullable: false
              - column:
                  name: limit_datetime
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_limits_account_category_datetime
            tableName: expense_limits
            columns:
              - column:
                  name: account_from
              - column:
                  name: expense_category
              - column:
                  name: limit_datetime

        - createIndex:
            indexName: idx_limits_account_datetime
            tableName: expense_limits
            columns:
              - column:
                  name: account_from
              - column:
                  name: limit_datetime
