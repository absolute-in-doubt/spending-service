databaseChangeLog:
  - changeSet:
      id: 005-create-unprocessed-transactions
      author: spending-service
      changes:
        - createSequence:
            sequenceName: unprocessed_transaction_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: unprocessed_transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: nextval('unprocessed_transaction_seq')
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_unprocessed_transactions
                    nullable: false
              - column:
                  name: account_from
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: account_to
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: currency_shortname
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: sum
                  type: NUMERIC(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: expense_category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: datetime
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: failure_reason
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: retry_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: lease_token
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: leased_until
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_unprocessed_lease
            tableName: unprocessed_transactions
            columns:
              - column:
                  name: status
              - column:
                  name: leased_until
              - column:
                  name: retry_count

        - createIndex:
            indexName: idx_unprocessed_status_created
            tableName: unprocessed_transactions
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
