services:
  app:
    build: .
    env_file:
      - env/app.env
    ports:
      - '8080:8080'
    depends_on:
      - postgres

  postgres:
    image: 'postgres:15'
    env_file:
      - env/postgres.env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: